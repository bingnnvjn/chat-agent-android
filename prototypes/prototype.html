<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Chat Agent — iOS 26 风格原型</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #0a0a0a;
  --bg-glass: rgba(255,255,255,0.06);
  --bg-glass-strong: rgba(255,255,255,0.10);
  --bg-bubble-ai: rgba(255,255,255,0.07);
  --text: #ffffff;
  --text-secondary: rgba(255,255,255,0.65);
  --text-muted: rgba(255,255,255,0.35);
  --accent: #10a37f;
  --accent-dim: rgba(16,163,127,0.25);
  --border-glass: rgba(255,255,255,0.12);
  --radius-pill: 999px;
  --radius-bubble: 20px;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', 'Helvetica Neue', sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh; height: 100dvh;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  font-size: 16px;
  line-height: 1.5;
}

.app {
  height: 100%;
  display: flex;
  flex-direction: column;
  position: relative;
}

/* ─── 顶栏：分体式 ─── */
.top-bar {
  position: fixed;
  top: 16px;
  left: 0; right: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 14px;
  pointer-events: none;
}

.top-btn {
  width: 48px; height: 48px;
  border-radius: 50%;
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(30px) saturate(180%);
  -webkit-backdrop-filter: blur(30px) saturate(180%);
  border: 0.5px solid var(--border-glass);
  box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  color: var(--text);
  font-size: 20px;
  cursor: pointer;
  pointer-events: auto;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: background 0.2s;
  -webkit-tap-highlight-color: transparent;
}

.top-btn:active { background: rgba(255,255,255,0.18); }

.top-btn .plus-icon { font-size: 26px; font-weight: 300; line-height: 1; display: inline-block; }

.top-title {
  pointer-events: auto;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 22px;
  margin-top: 2px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(30px) saturate(180%);
  -webkit-backdrop-filter: blur(30px) saturate(180%);
  border: 0.5px solid var(--border-glass);
  border-radius: var(--radius-pill);
  box-shadow: 0 4px 20px rgba(0,0,0,0.3);
}

.top-title span {
  font-size: 17px;
  font-weight: 590;
  letter-spacing: -0.2px;
  color: var(--text);
}

.top-title .arrow {
  font-size: 9px;
  color: var(--text-muted);
  margin-top: 1px;
}



/* ─── 内容区 ─── */
.content {
  flex: 1;
  overflow-y: auto;
  padding: 72px 14px 130px;
  -webkit-overflow-scrolling: touch;
}

/* 欢迎页 */
.welcome {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100%;
  text-align: center;
  gap: 16px;
  padding: 0 24px;
}

.welcome h1 {
  font-size: 34px;
  font-weight: 700;
  letter-spacing: -0.5px;
  color: var(--text);
}

.welcome .sub {
  color: var(--text-muted);
  font-size: 16px;
  font-weight: 400;
  letter-spacing: 0.1px;
}

.suggestions {
  display: flex;
  flex-direction: column;
  gap: 10px;
  width: 100%;
  max-width: 320px;
  margin-top: 12px;
}

.suggestion-chip {
  background: var(--bg-glass);
  border: 0.5px solid var(--border-glass);
  border-radius: 14px;
  padding: 16px 20px;
  color: var(--text-secondary);
  font-size: 15px;
  font-weight: 450;
  cursor: pointer;
  text-align: center;
  transition: background 0.15s;
  -webkit-tap-highlight-color: transparent;
}

.suggestion-chip:active { background: rgba(255,255,255,0.12); }

/* 消息 */
.message {
  display: flex;
  margin-bottom: 16px;
}

.message.user { justify-content: flex-end; }

.message-bubble {
  max-width: 80%;
  padding: 12px 16px;
  font-size: 15px;
  line-height: 1.55;
  word-wrap: break-word;
}

.message.user .message-bubble {
  background: var(--accent);
  color: #fff;
  border-radius: var(--radius-bubble) 4px var(--radius-bubble) var(--radius-bubble);
}

.message.assistant .message-bubble {
  background: var(--bg-bubble-ai);
  color: var(--text);
  border-radius: 4px var(--radius-bubble) var(--radius-bubble) var(--radius-bubble);
  backdrop-filter: blur(10px);
}

.streaming .message-bubble::after {
  content: '▊';
  animation: blink 0.8s infinite;
  color: var(--text-muted);
  margin-left: 3px;
}

@keyframes blink { 50% { opacity: 0; } }

/* ─── 底栏：玻璃药丸 ─── */
.bottom-area {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  z-index: 100;
  pointer-events: none;
}

.bottom-gradient {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 130px;
  background: linear-gradient(0deg, rgba(0,0,0,0.96) 25%, rgba(0,0,0,0.3) 70%, transparent 100%);
  pointer-events: none;
}

.input-wrapper {
  max-width: 500px;
  margin: 0 auto;
  padding: 0 12px 14px;
  position: relative;
  z-index: 1;
  pointer-events: auto;
}

.input-container {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 0;
  background: var(--bg-glass-strong);
  backdrop-filter: blur(30px) saturate(180%);
  -webkit-backdrop-filter: blur(30px) saturate(180%);
  border: 0.5px solid var(--border-glass);
  border-radius: var(--radius-pill);
  padding: 2px 4px 2px 16px;
  box-shadow: 0 4px 30px rgba(0,0,0,0.4);
}

.input-container:focus-within {
  border-color: rgba(255,255,255,0.2);
}

.input-row {
  display: flex;
  align-items: center;
  gap: 10px;
}

.attach-btn {
  width: 44px; height: 44px;
  border-radius: 50%;
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(30px) saturate(180%);
  -webkit-backdrop-filter: blur(30px) saturate(180%);
  border: 0.5px solid var(--border-glass);
  box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  color: var(--text-secondary);
  font-size: 26px;
  font-weight: 300;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.input-field {
  flex: 1;
  background: transparent;
  border: none;
  color: var(--text);
  font-size: 16px;
  font-family: inherit;
  resize: none;
  max-height: 100px;
  padding: 8px 4px;
  line-height: 1.45;
  outline: none;
}

.input-field::placeholder { color: var(--text-muted); }

.input-actions {
  display: flex;
  align-items: center;
  gap: 1px;
  flex-shrink: 0;
}

.action-btn {
  width: 40px; height: 40px;
  border-radius: 50%;
  background: none;
  border: none;
  font-size: 17px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.send-btn {
  height: 34px;
  min-width: 44px;
  border-radius: 17px;
  padding: 0 14px;
  background: var(--accent);
  border: none;
  color: #fff;
  font-size: 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: opacity 0.2s;
}

.send-btn:disabled {
  background: rgba(255,255,255,0.10);
  color: var(--text-muted);
  cursor: not-allowed;
}

/* ─── 侧边栏 ─── */
.sidebar-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 150;
  visibility: hidden;
  opacity: 0;
  transition: all 0.3s ease;
}

.sidebar-overlay.active { visibility: visible; opacity: 1; }

.sidebar {
  position: fixed;
  top: 0; left: -300px;
  width: 290px;
  height: 100%;
  z-index: 160;
  background: rgba(20,20,20,0.85);
  backdrop-filter: blur(40px) saturate(180%);
  -webkit-backdrop-filter: blur(40px) saturate(180%);
  border-right: 0.5px solid var(--border-glass);
  display: flex;
  flex-direction: column;
  transition: left 0.3s cubic-bezier(0.22, 1, 0.36, 1);
  padding: 14px 12px;
}

.sidebar.open { left: 0; }

.sidebar-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
  padding: 0 4px;
}

.sidebar-header button {
  background: rgba(255,255,255,0.08);
  border: 0.5px solid var(--border-glass);
  border-radius: 12px;
  padding: 10px 16px;
  color: var(--text);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  flex: 1;
  display: flex;
  align-items: center;
  gap: 8px;
}

.sidebar-header .close-btn {
  width: 40px; height: 40px;
  flex: none;
  border-radius: 50%;
  padding: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
}

.sidebar-list {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.sidebar-item {
  padding: 12px 14px;
  border-radius: 12px;
  cursor: pointer;
  font-size: 15px;
  color: var(--text-secondary);
  display: flex;
  align-items: center;
  justify-content: space-between;
  transition: background 0.15s;
}

.sidebar-item:active { background: rgba(255,255,255,0.08); }
.sidebar-item.active { background: rgba(255,255,255,0.06); color: var(--text); }

.sidebar-item .del-btn {
  width: 28px; height: 28px;
  border-radius: 50%;
  background: none;
  border: none;
  color: var(--text-muted);
  font-size: 14px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
}

.sidebar-item:hover .del-btn { opacity: 0.6; }
.sidebar-item .del-btn:active { opacity: 1; color: #ef4444; }

.sidebar-footer {
  margin-top: 8px;
  padding-top: 12px;
  border-top: 0.5px solid var(--border-glass);
}

.sidebar-footer button {
  width: 100%;
  background: rgba(255,255,255,0.06);
  border: 0.5px solid var(--border-glass);
  border-radius: 12px;
  padding: 12px 16px;
  color: var(--text-secondary);
  font-size: 15px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 10px;
  transition: background 0.15s;
}

.sidebar-footer button:active { background: rgba(255,255,255,0.10); }

/* ─── 模型选择弹窗 ─── */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  visibility: hidden;
  opacity: 0;
  transition: all 0.25s ease;
}

.modal-overlay.active { visibility: visible; opacity: 1; }

.modal {
  background: rgba(30,30,30,0.85);
  backdrop-filter: blur(40px) saturate(180%);
  -webkit-backdrop-filter: blur(40px) saturate(180%);
  border: 0.5px solid var(--border-glass);
  border-radius: 20px;
  width: 76%;
  max-width: 300px;
  padding: 8px;
  box-shadow: 0 12px 60px rgba(0,0,0,0.6);
}

.modal h3 {
  font-size: 14px;
  font-weight: 590;
  padding: 10px 12px 4px;
  color: var(--text-secondary);
  letter-spacing: 0.2px;
  text-transform: uppercase;
}

.modal-item {
  padding: 12px 16px;
  border-radius: 12px;
  cursor: pointer;
  font-size: 16px;
  font-weight: 450;
  color: var(--text);
  transition: background 0.15s;
}

.modal-item:active { background: rgba(255,255,255,0.10); }
.modal-item.active { background: var(--accent-dim); color: var(--accent); }

/* ─── 错误提示 ─── */
.error-bar {
  background: rgba(239,68,68,0.12);
  backdrop-filter: blur(10px);
  color: #ef4444;
  padding: 8px 16px;
  font-size: 13px;
  text-align: left;
  position: fixed;
  bottom: 120px;
  left: 12px; right: 12px;
  z-index: 90;
  border-radius: 12px;
  border: 0.5px solid rgba(239,68,68,0.2);
}
</style>
</head>
<body>

<div class="app">
  <!-- 顶部渐变遮罩（已有 top-bar-blur 替代） -->

  <!-- 顶栏：分体式 -->
  <div class="top-bar">
    <button class="top-btn" onclick="toggleSidebar()">☰</button>
    <div class="top-title" onclick="toggleModelModal()">
      <span id="modelLabel">deepseek-v4</span>
      <span class="arrow">▾</span>
    </div>
    <button class="top-btn" onclick="newChat()"><span class="plus-icon">＋</span></button>
  </div>

  <!-- 内容区 -->
  <div class="content" id="content">
    <div class="welcome" id="welcome">
      <h1>Chat Agent</h1>
      <p class="sub">有什么可以帮助你的？</p>
      <div class="suggestions">
        <div class="suggestion-chip" onclick="sendSuggestion('帮我写一首诗')">帮我写一首诗</div>
        <div class="suggestion-chip" onclick="sendSuggestion('今天天气怎么样？')">今天天气怎么样？</div>
        <div class="suggestion-chip" onclick="sendSuggestion('用 Python 实现冒泡排序')">用 Python 实现冒泡排序</div>
      </div>
    </div>
    <div id="messages" style="display:none"></div>
  </div>

  <!-- 错误提示 -->
  <div class="error-bar" id="errorBar" style="display:none"></div>

  <!-- 底栏 -->
  <div class="bottom-area">
    <div class="bottom-gradient"></div>
    <div class="input-wrapper">
      <div class="input-row">
        <button class="attach-btn" onclick="alert('附件功能待接入')">+</button>
        <div class="input-container">
          <textarea class="input-field" id="inputField" placeholder="输入消息..." rows="1" oninput="autoResize(this);toggleSendBtn()"></textarea>
          <div class="input-actions">
            <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled>↑</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 侧边栏遮罩 -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

<!-- 侧边栏 -->
<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <button onclick="newChat(); closeSidebar()">＋ 新对话</button>
    <button class="close-btn" onclick="closeSidebar()">✕</button>
  </div>
  <div class="sidebar-list" id="sidebarList">
    <div class="sidebar-item active" onclick="selectConversation(this)">
      新对话
      <button class="del-btn" onclick="event.stopPropagation(); this.closest('.sidebar-item').remove()">✕</button>
    </div>
  </div>
  <div class="sidebar-footer">
    <button onclick="alert('设置待实现')">⚙ 设置</button>
  </div>
</div>

<!-- 模型选择弹窗 -->
<div class="modal-overlay" id="modelModal" onclick="this.classList.remove('active')">
  <div class="modal" onclick="event.stopPropagation()">
    <h3>选择模型</h3>
    <div class="modal-item active" onclick="selectModel(this,'deepseek-v4')">deepseek-v4</div>
    <div class="modal-item" onclick="selectModel(this,'deepseek-r1')">deepseek-r1</div>
    <div class="modal-item" onclick="selectModel(this,'agnes-ai')">agnes-ai</div>
  </div>
</div>

<script>
let currentModel = 'deepseek-v4';
let messageCount = 0;

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebarOverlay').classList.toggle('active');
}

function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('active');
}

function selectConversation(el) {
  document.querySelectorAll('.sidebar-item').forEach(i => i.classList.remove('active'));
  el.classList.add('active');
  closeSidebar();
}

function toggleModelModal() {
  document.getElementById('modelModal').classList.toggle('active');
}

function selectModel(el, model) {
  document.querySelectorAll('.modal-item').forEach(i => i.classList.remove('active'));
  el.classList.add('active');
  currentModel = model;
  document.getElementById('modelLabel').textContent = model;
  document.getElementById('modelModal').classList.remove('active');
}

function newChat() {
  document.getElementById('messages').style.display = 'none';
  document.getElementById('messages').innerHTML = '';
  document.getElementById('welcome').style.display = 'flex';
  document.getElementById('inputField').value = '';
  toggleSendBtn();
  messageCount = 0;
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 100) + 'px';
}

function toggleSendBtn() {
  const val = document.getElementById('inputField').value.trim();
  document.getElementById('sendBtn').disabled = !val;
}

function addMessage(content, isUser) {
  const msgs = document.getElementById('messages');
  const welcome = document.getElementById('welcome');
  welcome.style.display = 'none';
  msgs.style.display = 'block';

  const div = document.createElement('div');
  div.className = 'message ' + (isUser ? 'user' : 'assistant');
  div.innerHTML = '<div class="message-bubble">' + escapeHtml(content) + '</div>';
  msgs.appendChild(div);
  scrollToBottom();
}

function addStreamingMessage() {
  const msgs = document.getElementById('messages');
  const welcome = document.getElementById('welcome');
  welcome.style.display = 'none';
  msgs.style.display = 'block';

  let existing = msgs.querySelector('.streaming');
  if (existing) return existing.querySelector('.message-bubble');

  const div = document.createElement('div');
  div.className = 'message assistant streaming';
  div.innerHTML = '<div class="message-bubble"></div>';
  msgs.appendChild(div);
  scrollToBottom();
  return div.querySelector('.message-bubble');
}

function scrollToBottom() {
  const content = document.getElementById('content');
  setTimeout(() => { content.scrollTop = content.scrollHeight; }, 10);
}

function escapeHtml(text) {
  const d = document.createElement('div');
  d.textContent = text;
  return d.innerHTML;
}

function sendMessage() {
  const input = document.getElementById('inputField');
  const text = input.value.trim();
  if (!text) return;

  addMessage(text, true);
  input.value = '';
  input.style.height = 'auto';
  toggleSendBtn();

  const bubble = addStreamingMessage();
  const response = '你好！我是 AI 助手。你刚才说的是：\n\n" ' + text + ' "\n\n这是一个支持 **Markdown** 格式的回复示例。';
  let idx = 0;
  function typeNext() {
    if (idx < response.length) {
      const chunkSize = Math.floor(Math.random() * 3) + 1;
      const chunk = response.substring(idx, Math.min(idx + chunkSize, response.length));
      bubble.textContent += chunk;
      idx += chunkSize;
      scrollToBottom();
      setTimeout(typeNext, 25 + Math.random() * 35);
    } else {
      const parent = bubble.closest('.message');
      parent.classList.remove('streaming');
      messageCount++;
    }
  }
  typeNext();
}

function sendSuggestion(text) {
  document.getElementById('inputField').value = text;
  sendMessage();
}
</script>
</body>
</html>
