<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI Messages — 1:1 复刻</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', 'PingFang SC', sans-serif;
  background: #000;
  color: #fff;
  height: 100vh; height: 100dvh;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

.app {
  height: 100%; display: flex; flex-direction: column;
  background: linear-gradient(180deg, #1A0533 0%, #4B1F7A 35%, #6B2FA0 55%, #9B4DCA 100%);
  position: relative;
}

/* ═══ 导航栏 ═══ */
.nav-bar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  height: 76px;
  padding: 0 14px;
  display: flex; align-items: center; justify-content: space-between;
  background: none;
}

.nav-btn {
  width: 44px; height: 44px; border-radius: 50%;
  background: #3A3A3C;
  border: none; color: #FFFFFF; font-size: 20px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}

.nav-center {
  display: flex; align-items: center; justify-content: center;
}

.nav-name {
  height: 44px; padding: 0 18px;
  display: flex; align-items: center; gap: 3px;
  background: #3A3A3C;
  border-radius: 22px;
  font-size: 14px; font-weight: 500; color: #FFFFFF;
}
.nav-name .arrow { font-size: 11px; opacity: 0.6; margin-top: 1px; }

/* ═══ 内容区 ═══ */
.content {
  flex: 1; overflow-y: auto;
  padding: 85px 8px 100px;
  -webkit-overflow-scrolling: touch;
}

.time-stamp {
  text-align: center; font-size: 13px; color: rgba(255,255,255,0.6);
  padding: 14px 0 8px; letter-spacing: 0.2px;
}

/* 消息 — 圆角 18px */
.message { display: flex; margin-bottom: 14px; padding: 0 8px; }
.message.user { justify-content: flex-end; }
.message.ai { justify-content: flex-start; }

.message-bubble {
  max-width: 76%; padding: 12px 16px;
  font-size: 16px; line-height: 1.45; word-wrap: break-word;
}

.message.user .message-bubble {
  background: #007AFF; color: #fff;
  border-radius: 18px 18px 4px 18px;
}

.message.ai .message-bubble {
  background: rgba(229,229,234,0.92); color: #000;
  border-radius: 18px 18px 18px 4px;
}

/* ═══ 底栏 ═══ */
.bottom-wrap {
  position: fixed; bottom: 12px; left: 0; right: 0; z-index: 100;
  height: 76px;
  background: none;
  display: flex; align-items: center; justify-content: center;
  padding: 0 14px;
  pointer-events: none;
}

.input-row {
  display: flex; align-items: center; gap: 8px;
  max-width: 340px; width: 100%;
  pointer-events: auto;
}

.plus-btn {
  width: 42px; height: 42px; border-radius: 50%;
  background: #34C759; border: none;
  color: #fff; font-size: 22px; font-weight: 300;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}

.input-capsule {
  flex: 1; display: flex; align-items: center;
  background: rgba(255,255,255,0.65);
  border-radius: 21px;
  padding: 0 4px 0 14px;
  height: 42px;
}

.input-capsule textarea {
  flex: 1; background: transparent; border: none; color: #000;
  font-size: 16px; font-family: inherit; resize: none;
  max-height: 100px; padding: 8px 4px; line-height: 1.4; outline: none;
}
.input-capsule textarea::placeholder { color: #A0A0A0; }

.mic-btn {
  width: 36px; height: 36px; border-radius: 50%;
  background: #3A3A3C; border: none;
  color: #FFFFFF; font-size: 16px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
</style>
</head>
<body>

<div class="app">
  <!-- 导航栏 -->
  <div class="nav-bar">
    <button class="nav-btn" onclick="toggleSidebar()">‹</button>
    <div class="nav-center">
      <div class="nav-name">DeepSeek <span class="arrow">›</span></div>
    </div>
    <button class="nav-btn" onclick="alert('视频')">📹</button>
  </div>

  <!-- 内容 -->
  <div class="content" id="content">
    <div class="time-stamp">今天 下午4:28</div>

    <div class="message ai"><div class="message-bubble">你好！我是 DeepSeek，有什么可以帮你的？</div></div>
    <div class="message user"><div class="message-bubble">帮我写一首关于夏天的诗</div></div>
    <div class="message ai"><div class="message-bubble"><b>《夏》</b><br><br>蝉鸣穿过正午的树荫<br>阳光把影子烙在路上</div></div>
    <div class="message user"><div class="message-bubble">写得不错！再帮我解释一下什么是 Liquid Glass</div></div>
    <div class="message ai"><div class="message-bubble">Liquid Glass 是苹果在 WWDC 2025 推出的全新设计语言，采用半透明毛玻璃材质。</div></div>
    <div class="message user"><div class="message-bubble">那它和 iOS 18 的设计有什么区别？</div></div>
    <div class="message ai"><div class="message-bubble">iOS 18 是扁平化设计，而 Liquid Glass 引入了多层透明度和模糊效果。</div></div>
    <div class="message user"><div class="message-bubble">好的，非常感谢！</div></div>
    <div class="message ai"><div class="message-bubble">不客气！有其他问题随时问我。</div></div>
  </div>

  <!-- 底栏 -->
  <div class="bottom-wrap">
    <div class="input-row">
      <button class="plus-btn" onclick="alert('附件')">+</button>
      <div class="input-capsule">
        <textarea rows="1" placeholder="iMessage 信息" oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,100)+'px'"></textarea>
        <button class="mic-btn">🎤</button>
      </div>
    </div>
  </div>
</div>

<script>
function toggleSidebar() { alert('侧边栏'); }
</script>
</body>
</html>
